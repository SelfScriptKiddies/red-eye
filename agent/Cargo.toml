[package]
name = "red-eye-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
async-nats = "0.42.0"
pcap = "2.2.0"
bincode = "2.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
log = "0.4"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colog = "1.3.0"
futures = "0.3"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
hostname = "0.4"
harpoon-core = { path = "../../harpoon/crates/harpoon-core", features = ["regex-filter", "tls", "http2"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
hex = "0.4"
