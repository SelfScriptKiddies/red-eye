events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Server configuration
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Docker embedded DNS: re-resolve container names at runtime
        # (used by the variable proxy_pass in the /api location below, so a
        # backend container restart with a new IP does not cause 502s)
        resolver 127.0.0.11 valid=5s ipv6=off;

        include /etc/nginx/security-headers.conf;

        # API proxy to backend
        location ^~ /api {
            include /etc/nginx/security-headers.conf;

            # Variable proxy_pass forces runtime DNS resolution via the
            # resolver above; no URI part, so the original request URI is
            # passed through unchanged (same as the static form).
            set $red_eye_backend "http://backend:8000";
            proxy_pass $red_eye_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Agent binary download - public by design (see
        # backend/src/api/download.rs); plain proxy, no websockets.
        location ^~ /download {
            include /etc/nginx/security-headers.conf;
            set $red_eye_backend_dl "http://backend:8000";
            proxy_pass $red_eye_backend_dl;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
        }

        # Build-hashed assets are content-addressed: a cache miss is a
        # deployment error and must never fall back to the SPA entry point.
        location ^~ /assets/ {
            include /etc/nginx/security-headers.conf;
            # No always flag: 404 misses must not be cached for a year.
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Release metadata is re-fetched by the backend version check after
        # every deploy; serving it stale would mask a mixed-asset release.
        location = /version.json {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Keep the HTML entry point revalidated so a reload always finds the
        # asset hash set of the running release.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Unhashed root files (favicon, font licenses): content can change on
        # deploy, so revalidate instead of caching long-term.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|txt)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # React Router (SPA) fallback
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            include /etc/nginx/security-headers.conf;
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
