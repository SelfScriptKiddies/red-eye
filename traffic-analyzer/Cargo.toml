[package]
name = "traffic-analyzer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
config-manager = "0.2.0"
config = "0.15.9"
colog = "1.3.0"
log = "0.4.22"
pcap = "2.2.0"
pnet = "0.35.0"
tokio = { version = "1.44.0", features = ["full"] }
uuid = { version = "1.6", features = ["v4"] }
rdkafka = "0.37.0"
once_cell = "1.20.3"
serde = "1.0.215"
serde_json = "1.0.140"
regex = "1.11.0"
sqlx = { version = "0.8.2", features = ["runtime-tokio-rustls", "postgres", "ipnetwork"] }