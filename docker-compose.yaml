services:
  db:
    build:
      context: ./database
    restart: always
    env_file:
      - .env
    volumes:
      - ./volume/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  nats:
    image: nats:alpine
    container_name: nats
    restart: always
    command: -c /etc/nats/nats.conf
    ports:
      - "4222:4222" # client port
      # - "6222:6222" # cluster port
      - "8222:8222" # monitoring port
    volumes:
      - ./message-broker/nats.conf:/etc/nats/nats.conf
      - ./volume/nats:/data
      

