services:
  db:
    build:
      context: ./database
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    shm_size: 512m
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_SCHEMA}
    volumes:
      - ./volume/postgres:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"  # Uncomment to expose port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 3

  nats:
    image: nats:alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: -c /etc/nats/nats.conf
    env_file:
      - .env
    ports:
      - "4222:4222" # client port
      # - "6222:6222" # cluster port
      # - "8222:8222" # monitoring port
    volumes:
      - ./message-broker/nats.conf:/etc/nats/nats.conf
      - ./volume/nats:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      # Repo root: the build needs the shared proto/
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Stamps backend + bundled agent binary; exported by the Makefile.
        RED_EYE_GIT_SHA: ${RED_EYE_GIT_SHA:-}
        RED_EYE_VERSION: ${RED_EYE_VERSION:-}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - nats
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  traffic-analyzer:
    build:
      # Repo root: the build needs the shared proto/
      context: .
      dockerfile: traffic-analyzer/Dockerfile
      args:
        RED_EYE_GIT_SHA: ${RED_EYE_GIT_SHA:-}
        RED_EYE_VERSION: ${RED_EYE_VERSION:-}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - .env
    depends_on:
      - nats
      - db

  frontend:
    build:
      context: ./frontend
      args:
        RED_EYE_GIT_SHA: ${RED_EYE_GIT_SHA:-}
        RED_EYE_VERSION: ${RED_EYE_VERSION:-}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "3000:80"
    depends_on:
      - backend

  # --- LLM-SOC and MCP (all restrictive defaults: MCP read-only, SOC off) ---

  # Remote MCP interface. Read-only unless the operator redeploys with
  # MCP_MODE=full_control AND MCP_ALLOW_FULL_CONTROL=true. Holds no
  # database/NATS credentials; talks only to the backend API. MCP_SERVICE_TOKEN
  # and MCP_TOKEN: generate in Red Eye Settings (MCP section), never bake into
  # the image. Remote access must terminate TLS at the central nginx proxying
  # /mcp with buffering disabled and bounded body size/timeouts.
  red-eye-mcp:
    build:
      context: .
      dockerfile: red-eye-mcp/Dockerfile
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - RED_EYE_BACKEND_URL=http://backend:8000
      - MCP_SERVICE_TOKEN=${MCP_SERVICE_TOKEN:-}
      - MCP_MODE=read_only
      - MCP_ALLOW_FULL_CONTROL=false
      - MCP_BIND=0.0.0.0:8081
    depends_on:
      - backend

  # LLM-SOC triage worker. Talks ONLY to the backend job API and the
  # read-only MCP service; no DB/NATS credentials, no volumes. SOC stays
  # disabled (soc_enabled=false) until an operator enables it in Settings.
  soc-worker:
    build:
      context: .
      dockerfile: soc-worker/Dockerfile
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - RED_EYE_BACKEND_URL=http://backend:8000
      - RED_EYE_MCP_URL=http://red-eye-mcp:8081/mcp
      - SOC_WORKER_TOKEN=${SOC_WORKER_TOKEN:-}
      - MCP_TOKEN=${MCP_TOKEN:-}
      - WORKER_ID=soc-worker-1

  # The self-hosted LLM endpoint is operator-managed and NOT shipped here:
  # point soc_base_url at it in Settings (default http://llm:8080/v1).
  # Example (vLLM serving a small quantized model on the compose network):
  # llm:
  #   image: vllm/vllm-openai:latest
  #   command: --model /models/qwen3.8-flash-next-iq3 --port 8080
  #   volumes:
  #     - ./volume/llm-models:/models:ro

  # --- Monitoring (optional) ---

  prometheus:
    image: prom/prometheus:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "9099:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./volume/prometheus:/prometheus
    depends_on:
      - backend
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./volume/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring
