services:
  db:
    build:
      context: ./database
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    shm_size: 512m
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_SCHEMA}
    volumes:
      - ./volume/postgres:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"  # Uncomment to expose port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 3

  nats:
    image: nats:alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command: -c /etc/nats/nats.conf
    env_file:
      - .env
    ports:
      - "4222:4222" # client port
      # - "6222:6222" # cluster port
      # - "8222:8222" # monitoring port
    volumes:
      - ./message-broker/nats.conf:/etc/nats/nats.conf
      - ./volume/nats:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - nats
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  traffic-analyzer:
    build:
      # Repo root: the build needs the shared proto/
      context: .
      dockerfile: traffic-analyzer/Dockerfile
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - .env
    depends_on:
      - nats
      - db

  frontend:
    build: ./frontend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "3000:80"
    depends_on:
      - backend

  # --- Monitoring (optional) ---

  prometheus:
    image: prom/prometheus:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "9099:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./volume/prometheus:/prometheus
    depends_on:
      - backend
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./volume/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring
