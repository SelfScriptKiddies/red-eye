[package]
name = "soc-worker"
version = "0.1.0"
edition = "2024"
authors = ["TonySD", "GreenHaze"]
description = "LLM-SOC triage worker: claims jobs from the Red Eye backend, gathers evidence through read-only MCP, runs a fixed playbook against a self-hosted LLM"

[dependencies]
rmcp = { version = "3.10", features = [
    "client",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4.22"
env_logger = "0.11.6"

[profile.release]
strip = true
