[package]
name = "red-eye-mcp"
version = "0.1.0"
edition = "2024"
authors = ["TonySD", "GreenHaze"]
description = "Remote MCP interface for Red Eye: bounded read-only inspection and explicitly opt-in full control"

[dependencies]
rmcp = { version = "3.10", features = [
    "server",
    "transport-streamable-http-server",
    "transport-worker",
] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4.22"
env_logger = "0.11.6"
sha2 = "0.10"

[profile.release]
strip = true
