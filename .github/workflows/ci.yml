# CI for pull requests (into dev/main) and direct pushes to dev.
#
# Jobs are path-filtered; `checks-ok` is the single aggregate job to list
# as a required status check in branch protection — it treats skipped
# jobs (unrelated paths) as success.

name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      analyzer: ${{ steps.filter.outputs.analyzer }}
      agent: ${{ steps.filter.outputs.agent }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            analyzer:
              - 'traffic-analyzer/**'
            agent:
              - 'agent/**'
            shared:
              - 'proto/**'
              - 'VERSION'
              - '.github/workflows/ci.yml'

  # A release PR (base = main) must carry a real version bump: VERSION has
  # to be a valid semver STRICTLY GREATER than the latest released tag.
  # Runs on every PR into main regardless of changed paths (a docs-only
  # "release" without a bump must fail here, not in release.yml).
  release-version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: VERSION must be semver and strictly greater than the last release
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION file contains '$VERSION' — expected semver X.Y.Z"
            exit 1
          fi
          LATEST="$(git ls-remote --tags origin 'refs/tags/v*' \
            | awk '{print $2}' | sed 's|^refs/tags/v||; s|\^{}$||' | sort -uV | tail -1)"
          echo "proposed: $VERSION, latest released: ${LATEST:-<none>}"
          if [ -n "$LATEST" ]; then
            HIGHEST="$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)"
            if [ "$VERSION" = "$LATEST" ] || [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::VERSION $VERSION is not greater than the last released $LATEST — run 'make bump V=<higher>' before merging to main"
              exit 1
            fi
          fi

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (errors only; warnings are advisory)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  rust:
    needs: changes
    # The wire contract (proto/) and this workflow affect every crate.
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.analyzer == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: backend
          - crate: traffic-analyzer
            apt: libpcap-dev
          - crate: agent
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Format
        run: cargo fmt --check

      # Advisory for now: the crates carry pre-existing clippy warnings.
      # Compile errors still fail the job; flip to `-- -D warnings` once
      # the warning backlog is cleared.
      - name: Clippy (warnings advisory)
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo test

  # Aggregate job — list this one as the required status check on main.
  checks-ok:
    needs: [release-version, frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any CI job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
